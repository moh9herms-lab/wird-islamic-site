<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مصحف مِشكاة</title><link href="https://fonts.googleapis.com/css2?family=Amiri&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="mushaf.css?v=6"><script defer src="mushaf.js?v=6"></script></head><body>
<header><button id="exit" class="brand"><img src="mishkat-icon-64.png" alt=""><span>مِشكاة<small>القرآن الكريم</small></span></button><div class="heading"><small>مصحف المدينة النبوية</small><b id="title">القرآن الكريم</b></div><nav><button id="search" title="البحث">⌕</button><button id="night" title="الوضع الليلي">☾</button><button id="back" title="العودة إلى الموقع">×</button></nav></header>
<div class="toolbar"><div><button id="index">☰ الفهرس</button><span class="edition">♧ حفص · مصحف المدينة</span></div><div class="tabs"><button id="reading" class="active">♧ القراءة</button><button id="tafsirTab">التفسير</button><button id="translationTab">الترجمة</button></div><div class="tools"><button id="planButton" title="الختمة">♧</button><button id="marks" title="الفواصل">☆</button><button id="share" title="مشاركة الصفحة">↗</button><button id="focus" title="قراءة مركزة">⛶</button><button id="settings" title="إعدادات العرض">⚙</button></div></div>
<div class="workspace"><main><div class="book-region"><button id="prevSpread" class="page-arrow right" aria-label="الصفحات السابقة">‹</button><div id="book" class="book" aria-live="polite"></div><button id="nextSpread" class="page-arrow left" aria-label="الصفحات التالية">›</button></div><div class="caption"><span id="meta"></span><span>اضغط على الآية لعرض خياراتها</span></div></main><aside id="detail"><div class="detail-head"><button id="prevVerse" aria-label="الآية السابقة">‹</button><div><b id="verseTitle"></b><small id="verseMeta"></small></div><button id="nextVerse" aria-label="الآية التالية">›</button><button id="closeDetail" aria-label="إغلاق لوحة الآية">×</button></div><div class="detail-tabs"><button data-tab="tafsir" class="active">التفسير</button><button data-tab="verses">الآيات</button><button data-tab="notes">ملاحظاتي</button></div><div class="detail-content"><div id="verseText" class="verse-text"></div><div id="detailBody"></div></div><div class="detail-actions"><button id="listen">▷ استمع</button><button id="mark">☆ فاصل</button><button id="copy">نسخ</button><button id="shareVerse">↗ مشاركة</button></div></aside></div>
<footer><div class="playback"><button id="audioPrev" aria-label="التلاوة السابقة">‹</button><button id="play" aria-label="تشغيل التلاوة">▶</button><button id="audioNext" aria-label="التلاوة التالية">›</button><div><b id="audioTitle">القرآن الكريم</b><small id="audioStatus">اختر قارئًا وابدأ الاستماع</small></div><button id="stop" aria-label="إيقاف التلاوة">×</button></div><div class="audio-options"><select id="reciter" aria-label="القارئ"></select><select id="mode" aria-label="نمط التلاوة"><option value="surah">السورة متصلة</option><option value="verse">آية آية · تتبّع</option></select><button id="repeat">↻ دون تكرار</button></div><div class="pagination"><button id="prev" aria-label="الصفحة السابقة">‹</button><button id="jump">الصفحة <b id="pageNo">١</b> من ٦٠٤</button><button id="next" aria-label="الصفحة التالية">›</button></div><div class="seek"><span id="time">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="موضع التلاوة" disabled><span id="duration">0:00</span></div></footer>
<div id="scrim" hidden></div><section id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" hidden><div class="dialog-head"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="إغلاق النافذة">×</button></div><div id="dialogBody"></div></section><div id="toast" role="status"></div><audio id="audio" preload="metadata"></audio><audio id="introAudio" preload="none"></audio></body></html>
